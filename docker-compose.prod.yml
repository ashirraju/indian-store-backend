services:
  # ==========================================
  # 1. POSTGRESQL 16 DATABASE
  # ==========================================
  indian-store-db:
    image: postgres:16-alpine
    container_name: indian_store_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-store_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-store_prod_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-indian_store_db}
    volumes:
      - indian_store_postgres_data:/var/lib/postgresql/data
    networks:
      - indian-store-network
      - keycloak_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-store_admin} -d ${DB_NAME:-indian_store_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. REDIS 7 CACHE
  # ==========================================
  indian-store-redis:
    image: redis:7-alpine
    container_name: indian_store_redis
    restart: always
    volumes:
      - indian_store_redis_data:/data
    networks:
      - indian-store-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. NODE.JS BACKEND API (EXPRESS)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indian_store_api
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: "postgresql://${DB_USER:-store_admin}:${DB_PASSWORD:-store_prod_secure_pass_2026}@indian-store-db:5432/${DB_NAME:-indian_store_db}"
      PGHOST: indian-store-db
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-indian_store_db}
      PGUSER: ${DB_USER:-store_admin}
      PGPASSWORD: ${DB_PASSWORD:-store_prod_secure_pass_2026}
      REDIS_HOST: indian-store-redis
      REDIS_PORT: 6379
      KEYCLOAK_URL: "https://indian-store-auth.trader-news.co.in"
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-indian-store}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-indian-store-api}
      KEYCLOAK_JWKS_URI: "https://indian-store-auth.trader-news.co.in/realms/${KEYCLOAK_REALM:-indian-store}/protocol/openid-connect/certs"
      DEV_AUTH_BYPASS: "false"
      CORS_ORIGIN: "*"
    networks:
      - indian-store-network
      - keycloak_net
    depends_on:
      indian-store-db:
        condition: service_healthy
      indian-store-redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.indian-store-api.rule=Host(`${API_DOMAIN:-indian-store-api.trader-news.co.in}`)"
      - "traefik.http.routers.indian-store-api.entrypoints=websecure"
      - "traefik.http.routers.indian-store-api.tls=true"
      - "traefik.http.routers.indian-store-api.tls.certresolver=myresolver"
      - "traefik.http.services.indian-store-api.loadbalancer.server.port=5001"

  # ==========================================
  # 4. KEYCLOAK IAM (AUTHENTICATION & RBAC)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: indian_store_keycloak
    restart: always
    command: start --http-enabled=true --proxy-headers=xforwarded --hostname=indian-store-auth.trader-news.co.in
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_prod_pass_2026}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://indian-store-db:5432/${DB_NAME:-indian_store_db}
      KC_DB_USERNAME: ${DB_USER:-store_admin}
      KC_DB_PASSWORD: ${DB_PASSWORD:-store_prod_secure_pass_2026}
      KC_DB_SCHEMA: keycloak_schema
      KC_HOSTNAME: indian-store-auth.trader-news.co.in
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms512m -Xmx1024m"
    volumes:
      - ./themes:/opt/keycloak/themes
    depends_on:
      indian-store-db:
        condition: service_healthy
    networks:
      - indian-store-network
      - keycloak_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.indian-store-auth.rule=Host(`${KEYCLOAK_DOMAIN:-indian-store-auth.trader-news.co.in}`)"
      - "traefik.http.routers.indian-store-auth.entrypoints=websecure"
      - "traefik.http.routers.indian-store-auth.tls=true"
      - "traefik.http.routers.indian-store-auth.tls.certresolver=myresolver"
      - "traefik.http.services.indian-store-auth.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.kc-buffering.buffering.maxResponseBodyBytes=10485760"
      - "traefik.http.routers.indian-store-auth.middlewares=kc-buffering"

volumes:
  indian_store_postgres_data:
  indian_store_redis_data:

networks:
  indian-store-network:
    driver: bridge
  keycloak_net:
    name: keycloak_keycloak_net
    external: true
