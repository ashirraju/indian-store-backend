# ========================================================
# TRAEFIK STATIC CONFIGURATION FILE (traefik.yml)
# ========================================================

global:
  checkNewVersion: true
  sendAnonymousUsage: false

# Traefik Web UI Dashboard
api:
  dashboard: true
  insecure: false

# HTTP and HTTPS Network Entrypoints
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# Automatic Let's Encrypt SSL Certificate Resolver
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${ACME_EMAIL:-admin@trader-news.co.in}
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# Docker Provider for Automatic Container Discovery
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: web-gateway

# Logging
log:
  level: INFO

accessLog: {}
